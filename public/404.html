<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>جاتكم اسحاب</title>
  <script>
    // SPA routing workaround for GitHub Pages:
    // saves the current path then redirects to index.html which restores it
    var l = window.location;
    sessionStorage.setItem('spa_redirect', l.pathname + l.search + l.hash);
    l.replace(l.protocol + '//' + l.host + l.pathname.split('/')[1] + '/?p=1');
  </script>
</head>
<body></body>
</html>
